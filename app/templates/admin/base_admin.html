<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}后台管理{% endblock %} · RecSys 2026</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Ctext x='16' y='22' font-size='13' text-anchor='middle' fill='white' font-family='Arial'%3EA%3C/text%3E%3C/svg%3E">
</head>
<body class="admin-body">
  <aside class="admin-side">
    <a class="admin-brand" href="{{ url_for('admin.dashboard') }}">
      <span class="brand-mark">RS</span>
      <span><b>管理后台</b><small>RecSys Course 2026</small></span>
    </a>
    <nav class="admin-nav">
      <a href="{{ url_for('admin.dashboard') }}" class="{{ 'on' if page == 'dashboard' }}"><i>▦</i>总览</a>
      <a href="{{ url_for('admin.items', dataset='movielens') }}" class="{{ 'on' if page == 'items' }}"><i>▤</i>物品管理</a>
      <a href="{{ url_for('admin.users', dataset='movielens') }}" class="{{ 'on' if page == 'users' }}"><i>♙</i>用户管理</a>
      <a href="{{ url_for('admin.recommendations', dataset='movielens') }}" class="{{ 'on' if page == 'recommendations' }}"><i>✦</i>推荐结果</a>
      <a href="{{ url_for('admin.feedback') }}" class="{{ 'on' if page == 'feedback' }}"><i>☷</i>行为日志</a>
      <a href="{{ url_for('admin.metrics') }}" class="{{ 'on' if page == 'metrics' }}"><i>▥</i>算法指标</a>
      <a href="{{ url_for('admin.translations', dataset='movielens') }}" class="{{ 'on' if page == 'translations' }}"><i>文</i>中文译名</a>
    </nav>
    <div class="admin-side-foot">
      <a href="/?dataset=movielens" target="_blank">← 返回前台</a>
      <form method="post" action="{{ url_for('admin.logout') }}">
        <button class="link-btn" type="submit">退出登录</button>
      </form>
    </div>
  </aside>

  <div class="admin-main">
    <header class="admin-top">
      <span class="admin-crumb">管理后台 / {% block crumb %}总览{% endblock %}</span>
      <span class="admin-user">管理员</span>
    </header>
    <main class="admin-content">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
