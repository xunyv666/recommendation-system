{% if pager.pages > 1 %}
<div class="pager">
  <span class="muted">共 {{ '{:,}'.format(pager.total) }} 条 · 第 {{ pager.page }}/{{ pager.pages }} 页</span>
  <div class="pager-links">
    <a class="btn ghost sm {{ 'disabled' if pager.page <= 1 }}" href="{{ request.path }}?{{ base_q }}page={{ pager.prev }}">上一页</a>
    <a class="btn ghost sm {{ 'disabled' if pager.page >= pager.pages }}" href="{{ request.path }}?{{ base_q }}page={{ pager.next }}">下一页</a>
  </div>
</div>
{% else %}
<div class="pager"><span class="muted">共 {{ '{:,}'.format(pager.total) }} 条</span></div>
{% endif %}
