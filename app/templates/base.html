<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}智能推荐系统{% endblock %} · RecSys 2026</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Ctext x='16' y='22' font-size='13' text-anchor='middle' fill='white' font-family='Arial'%3ERS%3C/text%3E%3C/svg%3E">
</head>
<body data-dataset="{{ dataset }}">

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/?dataset={{ dataset }}">
      <span class="brand-mark">RS</span>
      <span class="brand-text">智能推荐系统<small>Courses Design 2026</small></span>
    </a>
    <nav class="nav">
      <a href="/?dataset={{ dataset }}"   class="{{ 'on' if page=='home' }}">首页</a>
      <a href="/recommend?dataset={{ dataset }}" class="{{ 'on' if page=='recommend' }}">个性化推荐</a>
      <a href="/dashboard?dataset={{ dataset }}" class="{{ 'on' if page=='dashboard' }}">算法看板</a>
      <a href="/about" class="{{ 'on' if page=='about' }}">关于</a>
    </nav>
    <div class="domain-switch">
      <button data-ds="movielens" class="{{ 'on' if dataset=='movielens' }}">电影</button>
      <button data-ds="goodbooks" class="{{ 'on' if dataset=='goodbooks' }}">图书</button>
    </div>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="wrap">
    <span>推荐系统课程设计 · 南京财经大学</span>
    <span class="dot">·</span>
    <span>离线训练 + 在线查表架构</span>
    <span class="dot">·</span>
    <span id="healthTag">服务状态检测中…</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
