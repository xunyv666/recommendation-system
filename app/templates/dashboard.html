{% extends "base.html" %}
{% block title %}算法看板{% endblock %}

{% block content %}
<section class="section">
  <div class="section-head">
    <div>
      <h2>算法效果看板</h2>
      <p class="muted">同一数据切分下的全排序评测结果（8:1:1 时间序切分，Top-10 全量排序）</p>
    </div>
  </div>
  <div class="table-wrap">
    <table class="table" id="metricTable">
      <thead>
        <tr>
          <th>模型</th><th>Recall@10</th><th>NDCG@10</th><th>MRR@10</th>
          <th>Precision@10</th><th>训练耗时(s)</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="6" class="loading">加载中…</td></tr></tbody>
    </table>
  </div>
</section>

<section class="section">
  <div class="section-head"><h2>NDCG@10 对比</h2></div>
  <div class="bars" id="ndcgBars"></div>
</section>
{% endblock %}

{% block scripts %}
<script>App.initDashboard();</script>
{% endblock %}
